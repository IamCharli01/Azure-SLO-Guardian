name: SLO Daily Report

on:
  workflow_dispatch:
  # Uncomment below once AZURE_CREDENTIALS secret is configured:
  # schedule:
  #   - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  slo-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Azure SLO Guardian
        run: pip install -e .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Generate SLO report
        run: |
          azure-slo-guardian report --config slo-config.yaml --output slo-report.md
          azure-slo-guardian check --config slo-config.yaml --format json > slo-report.json
        continue-on-error: true

      - name: Post report to job summary
        if: always()
        run: cat slo-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slo-report-${{ github.run_number }}
          path: |
            slo-report.md
            slo-report.json
          retention-days: 30

      - name: Upload reports to Azure Storage
        if: always()
        uses: azure/CLI@v2
        with:
          inlineScript: |
            DATE_PATH=$(date -u +"%Y/%m/%d")
            CONTAINER="${{ secrets.SLO_REPORT_CONTAINER }}"
            ACCOUNT="${{ secrets.SLO_REPORT_STORAGE_ACCOUNT }}"

            az storage blob upload \
              --account-name "$ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "slo-reports/$DATE_PATH/slo-report.md" \
              --file slo-report.md \
              --auth-mode login \
              --overwrite

            az storage blob upload \
              --account-name "$ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "slo-reports/$DATE_PATH/slo-report.json" \
              --file slo-report.json \
              --auth-mode login \
              --overwrite

            echo "Reports uploaded to $ACCOUNT/$CONTAINER/slo-reports/$DATE_PATH/"
