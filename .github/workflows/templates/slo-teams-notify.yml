# SLO Teams Notifications — sends SLO status to Microsoft Teams
#
# Usage: Copy this file to .github/workflows/ in your repo.
#
# Auth: see slo-daily-report.yml for full auth setup instructions.
# Required RBAC: "Log Analytics Reader" on your workspace(s).
#
# Required secrets:
#   AZURE_CREDENTIALS — Azure service principal JSON (or use managed identity)
#   SLO_WEBHOOK_URL   — Teams incoming webhook URL
#                        (create via Workflows app in Teams channel)
#
# Behavior: --notify and --webhook-url are opt-in flags.
#           If SLO_WEBHOOK_URL is not set, the notify step will warn but not fail.
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │ SCHEDULE — You MUST set a schedule. Uncomment the one you want.     │
# └──────────────────────────────────────────────────────────────────────┘

name: SLO Teams Notify

on:
  schedule:
    - cron: '0 */6 * * *'     # <-- CHANGE THIS: Every 6 hours
    # - cron: '0 9 * * *'     # Daily 9 AM UTC
    # - cron: '0 * * * *'     # Every hour
    # - cron: '0 9 * * 1'     # Weekly Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slo-teams:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Azure SLO Guardian
        run: pip install -e ".[notifications]"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check SLOs and notify Teams
        run: |
          azure-slo-guardian check \
            --config slo-config.yaml \
            --notify teams \
            --webhook-url "$SLO_WEBHOOK_URL"
        env:
          SLO_WEBHOOK_URL: ${{ secrets.SLO_WEBHOOK_URL }}
        continue-on-error: true

      - name: Check burn-rate alerts and notify Teams
        run: |
          azure-slo-guardian alert \
            --config slo-config.yaml \
            --notify teams \
            --webhook-url "$SLO_WEBHOOK_URL"
        env:
          SLO_WEBHOOK_URL: ${{ secrets.SLO_WEBHOOK_URL }}
        continue-on-error: true
