name: 💡 Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We love hearing from the community. 💙
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve? What's the use case?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered?
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New SLO template
        - CLI enhancement
        - New integration (Grafana, PagerDuty, etc.)
        - Azure service support
        - Documentation
        - Performance
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Willing to contribute?
      options:
        - label: I'd be willing to submit a PR for this feature
