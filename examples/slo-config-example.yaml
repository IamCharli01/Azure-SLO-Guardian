# Example SLO Configuration for Azure SLO Guardian
# This demonstrates various SLO types and configurations

slos:
  # Example 1: API Availability SLO using Application Insights
  - name: api-availability
    description: "API service availability - 99.9% over 30 days"
    service: backend-api
    sli:
      type: availability
      query_type: application_insights
      workspace_id: "${APPINSIGHTS_WORKSPACE_ID}"
      good_query: |
        requests
        | where success == true and resultCode < 500
        | count
      total_query: |
        requests
        | count
    objectives:
      - target: 99.9
        window: 30d
      - target: 99.5
        window: 7d
    alerting:
      enabled: true
      windows:
        # Fast burn: 2% budget in 1 hour
        - consume_budget: 2.0
          short_window: 5m
          long_window: 1h
        # Slow burn: 5% budget in 6 hours
        - consume_budget: 5.0
          short_window: 30m
          long_window: 6h

  # Example 2: Latency SLO using Application Insights
  - name: api-latency-p95
    description: "95th percentile API latency under 500ms"
    service: backend-api
    sli:
      type: latency
      query_type: application_insights
      workspace_id: "${APPINSIGHTS_WORKSPACE_ID}"
      query: |
        requests
        | where name == "GET /api/users"
        | summarize percentile_95 = percentile(duration, 95)
      threshold: 500
      operator: lte
    objectives:
      - target: 99.5
        window: 7d

  # Example 3: Custom SLO using Log Analytics
  - name: queue-processing-success
    description: "Message queue processing success rate"
    service: message-processor
    sli:
      type: custom
      query_type: log_analytics
      workspace_id: "${LOG_ANALYTICS_WORKSPACE_ID}"
      good_query: |
        ContainerLog
        | where LogEntry has "message_processed" and LogEntry has "status=success"
        | count
      total_query: |
        ContainerLog
        | where LogEntry has "message_processed"
        | count
    objectives:
      - target: 99.99
        window: 30d
    alerting:
      enabled: true
      windows:
        - consume_budget: 10.0
          short_window: 15m
          long_window: 1h

  # Example 4: Frontend Availability (multiple objectives)
  - name: frontend-availability
    description: "Web frontend availability across multiple time windows"
    service: web-frontend
    sli:
      type: availability
      query_type: application_insights
      workspace_id: "${APPINSIGHTS_WORKSPACE_ID}"
      good_query: |
        pageViews
        | where success == true
        | count
      total_query: |
        pageViews
        | count
    objectives:
      - target: 99.95
        window: 30d
      - target: 99.9
        window: 7d
      - target: 99.5
        window: 24h
    alerting:
      enabled: true
      windows:
        - consume_budget: 2.0
          short_window: 5m
          long_window: 1h
        - consume_budget: 5.0
          short_window: 30m
          long_window: 6h
        - consume_budget: 10.0
          short_window: 2h
          long_window: 24h
